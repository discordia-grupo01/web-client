services:
  web:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "apk add --no-cache git >/dev/null && npm install --no-package-lock --no-audit --no-fund && npm run dev -- -H 0.0.0.0"
    env_file:
      - path: .env
        required: false
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_API_URL: ${API_URL_DOCKER:-http://host.docker.internal:8000}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8000/socket}
      NEXT_PUBLIC_UPLOAD_URL: ${NEXT_PUBLIC_UPLOAD_URL:-http://localhost:8000}
      NEXT_PUBLIC_VOICE_WS_URL: ${NEXT_PUBLIC_VOICE_WS_URL:-ws://localhost:8000/voice/socket}
      NEXT_PUBLIC_NOTIFICATIONS_WS_URL: ${NEXT_PUBLIC_NOTIFICATIONS_WS_URL:-ws://localhost:8000/notifications/socket}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${WEB_PORT:-3000}:3000"
    volumes:
      - .:/app
      - web_node_modules:/app/node_modules

volumes:
  web_node_modules:
